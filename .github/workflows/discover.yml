name: discover

on:
  schedule:
    - cron: "41 9 * * 1"   # Mondays, early morning Pacific
  workflow_dispatch:

concurrency:
  group: job-radar-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the board watchlist and company directory
        run: python3 -m jobradar discover
      - name: Save watchlist
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add data state
          git diff --cached --quiet && exit 0
          git commit -m "watchlist: weekly discovery"
          git pull --rebase
          git push
