name: poll

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; actual start times drift by a few minutes
  workflow_dispatch:

# All workflows that touch state/ share one group so they never run at the same time.
concurrency:
  group: job-radar-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check every source and email strong new matches
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: python3 -m jobradar poll
      - name: Save state
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -m "state: poll"
          git pull --rebase
          git push
